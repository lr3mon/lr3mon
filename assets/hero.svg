<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">1030.fx · StudioQ — 기획하고, 직접 만듭니다.</title>
  <desc id="desc">지금은 loveus와 Qommon Sense를 만들고 있어요. 오른쪽 터미널 창에는 loveus, DiskBloom, anchor, Korean-job-search가 나열되어 있습니다.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; }
    .mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="1040" cy="40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6667AB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6667AB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="20" fill="#0F1218"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>
  <path d="M0 330C210 286 380 372 600 338C820 304 1000 236 1280 268V420H0Z" fill="#131821" fill-opacity=".85"/>

  <!-- Left -->
  <g class="sans">
    <rect x="60" y="63" width="10" height="10" rx="2.5" fill="#6667AB"/>
    <text x="82" y="74" fill="#E8ECF1" font-size="20" font-weight="700" xml:lang="en">1030.fx</text>
    <text x="166" y="74" fill="#5F6B7A" font-size="17" xml:lang="en">StudioQ · @lr3mon</text>

    <text x="58" y="182" fill="#F3F5F8" font-size="64" font-weight="700" letter-spacing="-1.6">기획하고,</text>
    <text x="58" y="262" fill="#6667AB" font-size="64" font-weight="700" letter-spacing="-1.6">직접 만듭니다.</text>
    <text x="61" y="320" fill="#A3ACBA" font-size="22">지금은 loveus와 Qommon Sense를 만들고 있어요.</text>
  </g>

  <!-- Right: terminal window -->
  <g>
    <rect x="740" y="48" width="482" height="324" rx="14" fill="#151A22" stroke="#6667AB" stroke-opacity=".35"/>
    <path d="M740 92H1222" stroke="#FFFFFF" stroke-opacity=".06"/>
    <circle cx="766" cy="70" r="6" fill="#FF5F57" fill-opacity=".85"/>
    <circle cx="786" cy="70" r="6" fill="#FEBC2E" fill-opacity=".85"/>
    <circle cx="806" cy="70" r="6" fill="#28C840" fill-opacity=".85"/>
    <text x="981" y="75" fill="#5F6B7A" font-size="14" text-anchor="middle" class="mono">~/shipped — zsh</text>

    <g class="mono" font-size="19">
      <text x="768" y="132"><tspan fill="#8F90D4">$</tspan><tspan fill="#E8ECF1"> ls ~/shipped</tspan></text>

      <text x="768" y="176" fill="#E8ECF1">loveus/</text>
      <text x="1196" y="176" fill="#6B7787" font-size="16" text-anchor="end">iOS · App Store</text>
      <text x="768" y="212" fill="#E8ECF1">DiskBloom/</text>
      <text x="1196" y="212" fill="#6B7787" font-size="16" text-anchor="end">macOS · SwiftUI</text>
      <text x="768" y="248" fill="#E8ECF1">anchor/</text>
      <text x="1196" y="248" fill="#6B7787" font-size="16" text-anchor="end">CLI · SQLite</text>
      <text x="768" y="284" fill="#E8ECF1">Korean-job-search/</text>
      <text x="1196" y="284" fill="#6B7787" font-size="16" text-anchor="end">AI agent skill</text>

      <text x="768" y="336"><tspan fill="#8F90D4">$</tspan></text>
      <rect x="790" y="320" width="11" height="21" rx="1.5" fill="#6667AB" class="cursor"/>
    </g>
  </g>
</svg>
