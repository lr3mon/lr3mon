name: Profile graphs

on:
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile_graphs.py"
      - ".github/workflows/profile-graphs.yml"

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render graphs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/profile_graphs.py --out assets/stats

      - name: Commit if changed
        run: |
          git add assets/stats
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 프로필 그래프 갱신 [skip ci]"
          git push
